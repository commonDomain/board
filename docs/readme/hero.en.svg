<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Museboard — From ideas to action</title>
  <desc id="desc">Sticky notes, a mind map, and a notebook connected on a lavender workspace.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f5ff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#836bff"/><stop offset="1" stop-color="#5744eb"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#aaa1d0" opacity=".22"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#4e437e" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1440" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="360" rx="24" fill="url(#dots)"/>
  <circle cx="1400" cy="-35" r="190" fill="#e4deff" opacity=".5"/>
  <circle cx="70" cy="370" r="115" fill="#e9e5ff" opacity=".65"/>
  <g font-family="Inter, 'Microsoft YaHei', 'PingFang SC', sans-serif">
    <rect x="68" y="68" width="167" height="30" rx="15" fill="#ebe6ff"/>
    <text x="84" y="88" font-size="12" font-weight="700" letter-spacing="2" fill="#6957d9">YOUR IDEA SPACE</text>
    <text x="68" y="164" font-size="46" font-weight="750" fill="#26243c">From ideas to action.</text>
    <text x="70" y="211" font-size="18" fill="#666079">Capture ideas. Connect the dots. Move forward.</text>
    <g font-size="13" fill="#655c88">
      <rect x="70" y="255" width="150" height="34" rx="17" fill="#fff"/>
      <text x="88" y="277">Infinite canvas</text>
      <rect x="234" y="255" width="150" height="34" rx="17" fill="#fff"/>
      <text x="250" y="277">Freeform notes</text>
      <rect x="398" y="255" width="172" height="34" rx="17" fill="#fff"/>
      <text x="414" y="277">Live collaboration</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="790" y="75" width="158" height="157" rx="18" fill="#fff3b2" transform="rotate(-7 869 154)"/>
      <g transform="rotate(-7 869 154)" fill="#766327"><text x="812" y="116" font-size="15" font-weight="650">A good idea</text><rect x="812" y="139" width="104" height="6" rx="3" opacity=".18"/><rect x="812" y="159" width="80" height="6" rx="3" opacity=".18"/><path d="M814 188 Q833 175 849 187 T894 182" fill="none" stroke="#c3a337" stroke-width="3" stroke-linecap="round"/></g>
      <rect x="1077" y="154" width="227" height="158" rx="18" fill="white" transform="rotate(5 1190 233)"/>
      <g transform="rotate(5 1190 233)"><text x="1099" y="193" font-size="14" font-weight="650" fill="#554876">Make some progress</text><rect x="1099" y="211" width="178" height="5" rx="2.5" fill="#ebe7f3"/><rect x="1099" y="229" width="148" height="5" rx="2.5" fill="#ebe7f3"/><rect x="1099" y="252" width="13" height="13" rx="4" fill="#ddd4ff"/><path d="m1102 258 3 3 5-6" fill="none" stroke="#6957f5" stroke-width="1.7"/><rect x="1123" y="256" width="123" height="5" rx="2.5" fill="#ebe7f3"/></g>
    </g>
    <path d="M939 180 H987 Q1004 180 1004 162 V112 Q1004 96 1024 96 H1101 M1004 179 V235 Q1004 250 1026 250 H1060" fill="none" stroke="#b2a5e5" stroke-width="2.5" stroke-linecap="round"/>
    <g filter="url(#shadow)"><rect x="919" y="151" width="150" height="48" rx="13" fill="url(#accent)"/><text x="939" y="181" font-size="14" font-weight="650" fill="#fff">Grow your ideas</text><rect x="1101" y="74" width="162" height="44" rx="12" fill="white"/><text x="1123" y="102" font-size="14" fill="#635778">Find clarity</text></g>
    <circle cx="1347" cy="108" r="5" fill="#beafff"/><circle cx="736" cy="247" r="4" fill="#beafff"/><path d="M1285 62v16m-8-8h16" stroke="#bcaef1" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
